# Whose Memory Wins - experiment configuration.
# Everything here is recorded (with a hash) in every run manifest.

decision_model:
  provider: anthropic          # "anthropic" (real) or "mock" (offline software verification)
  model: claude-opus-5-5
  # Anthropic API version 2026-10-21 (sent by anthropic==2.4.0) rejects temperature/top_p/top_k
  # on every model, so sampling uses provider defaults and cannot be pinned. Recorded as such.
  effort: medium               # output_config.effort; low|medium|high|xhigh|max
  max_tokens: 16000            # per model call (includes adaptive thinking tokens)
  request_timeout_s: 120
  mock_policy: gullible        # only used when provider == mock: gullible|cautious|malformed|flaky

agent:
  max_model_calls: 4           # bounded agent loop: maximum model calls per trial
  max_tool_calls: 6            # maximum tool calls per trial (all tools count)

retries:
  max_attempts: 3              # attempts per model call for TRANSIENT provider failures only
  backoff_s: [2, 8]            # wait before attempt 2, 3

retrieval:
  top_k: 5
  threshold: 0.1
  embedder_provider: fastembed
  embedder_model: BAAI/bge-small-en-v1.5
  embedding_dims: 384
  vector_store: qdrant-local

ingestion_llm:                 # Mem0's own extraction LLM for Track 2 (normal ingestion)
  provider: anthropic          # "anthropic" or "mock"
  model: claude-opus-5-5
  max_tokens: 16000

limits:                        # hard ceilings enforced by the runner (required for real runs)
  max_api_calls: 60
  max_input_tokens: 400000
  max_output_tokens: 200000

# Prices are NOT hard-coded. Fill these in from the provider's current pricing page if you
# want a monetary estimate; otherwise cost is reported as "unknown".
pricing:
  usd_per_million_input_tokens: null
  usd_per_million_output_tokens: null
  max_cost_usd: null

paths:
  outputs: outputs
