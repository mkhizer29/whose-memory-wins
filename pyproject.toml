[project]
name = "whose-memory-wins"
version = "0.1.0"
description = "Whose Memory Wins: authority conflicts in the persistent memory of LLM agents (research harness)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# Exact pins = the versions this project was actually tested with (see docs/INTEGRATION_STATUS.md).
dependencies = [
    "mem0ai==2.2.1",
    "anthropic==2.4.0",
    "fastembed==0.9.1",
    "qdrant-client==1.20.0",
    "pydantic==2.14.2",
    "pandas==3.1.0",
    "matplotlib==3.11.2",
    "streamlit==1.66.1",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
wmw = "whose_memory_wins.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whose_memory_wins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real: calls a real paid API; skipped unless credentials AND WMW_RUN_REAL_TESTS=1 are present",
    "embeddings: needs the local fastembed model (downloaded once, ~130 MB)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
